name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    # Informational only. The HACS store-validation action reads file contents
    # via the GitHub API, which it can't do for a PRIVATE repo — so the
    # hacs.json / manifest content checks report as invalid here even though
    # they're valid (hassfest, which uses the local checkout, passes). This
    # check only matters if you ever submit to the public HACS default store.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Remove once the brand icon PR is merged into home-assistant/brands.
          ignore: brands
